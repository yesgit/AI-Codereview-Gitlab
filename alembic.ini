[alembic]
script_location = alembic
# optionally set sqlalchemy.url here as a fallback for alembic commands
# sqlalchemy.url = driver://user:pass@host/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

[alembic:runtime]
# The project's DB URL is normally provided by the application via get_engine().
# You may optionally set `sqlalchemy.url` above for standalone alembic usage.