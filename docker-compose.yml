services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    ports:
      - "${SERVER_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
      - ./conf/.env:/app/conf/.env:ro
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
