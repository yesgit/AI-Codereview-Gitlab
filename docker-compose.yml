services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: docker.io/hedw/ai-codereview-gitlab:1.4.0
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
    env_file:
      - ./conf/.env
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: docker.io/hedw/ai-codereview-gitlab-worker:1.4.0
    env_file:
      - ./conf/.env
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: ai_codereview
      MYSQL_USER: aiuser
      MYSQL_PASSWORD: aipassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped

volumes:
  data:
  log:
  mysql_data: