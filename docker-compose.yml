services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: docker.io/hedw/ai-codereview-gitlab:1.4.0
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
    env_file:
      - ./conf/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: docker.io/hedw/ai-codereview-gitlab-worker:1.4.0
    env_file:
      - ./conf/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: changeme
      MYSQL_DATABASE: ai_codereview
      MYSQL_USER: aiuser
      MYSQL_PASSWORD: aipassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaiuser", "-paipassword"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  data:
  log:
  mysql_data:
