services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: docker.io/hedw/ai-codereview-gitlab:1.4.0
    ports:
      - "5001:5001"
      - "5002:5002"
    volumes:
      - ./data:/app/data
      - ./log:/app/log
    env_file:
      - ./conf/.env
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    image: docker.io/hedw/ai-codereview-gitlab-worker:1.4.0
    env_file:
      - ./conf/.env
    restart: unless-stopped